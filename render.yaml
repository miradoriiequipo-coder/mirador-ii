services:
  - type: web
    name: mirador-ii-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Pegar la URL de Supabase aquí en el dashboard de Render
      - key: SECRET_KEY
        generateValue: true  # Render genera uno automáticamente
      - key: ADMIN_PASSWORD
        sync: false          # Tu contraseña de admin
